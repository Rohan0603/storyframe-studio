name: Temporary PR format export
on:
  push:
    branches:
      - feat/series-visual-evolution-qa
permissions:
  contents: read
jobs:
  formatted-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write eslint.config.js schemas/episode.schema.json src/audio.ts src/cli.ts src/image-generation.ts src/image-normalization.ts src/manifest.ts src/producer.ts src/series-evolution.ts src/visual-screening.ts src/youtube-state.ts tests/production-hardening.test.ts tests/series-evolution.test.ts
      - name: Export formatting to logs
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const paths = ['eslint.config.js','schemas/episode.schema.json','src/audio.ts','src/cli.ts','src/image-generation.ts','src/image-normalization.ts','src/manifest.ts','src/producer.ts','src/series-evolution.ts','src/visual-screening.ts','src/youtube-state.ts','tests/production-hardening.test.ts','tests/series-evolution.test.ts'];
          for (const path of paths) {
            console.log('SF_FORMAT_FILE ' + path + ' ' + readFileSync(path).toString('base64'));
          }
          NODE
