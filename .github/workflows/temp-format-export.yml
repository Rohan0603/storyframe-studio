name: Temporary strict PR format and build
on:
  push:
    branches:
      - feat/series-visual-evolution-qa
permissions:
  contents: read
jobs:
  format-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write schemas/episode.schema.json src/audio.ts src/cli.ts src/image-generation.ts src/image-normalization.ts src/manifest.ts src/measured-timing.ts src/production-evidence.ts src/producer.ts src/reference-bible.ts src/render.ts src/scaffold.ts src/series-evolution.ts src/sync.ts src/types.ts src/visual-screening.ts src/youtube-state.ts tests/audio.test.ts tests/production-hardening.test.ts tests/render.test.ts tests/series-evolution.test.ts tests/strict-production.test.ts tests/sync.test.ts docs/strict-series-production.md
      - name: Export formatted source
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of ["schemas/episode.schema.json","src/audio.ts","src/cli.ts","src/image-generation.ts","src/image-normalization.ts","src/manifest.ts","src/measured-timing.ts","src/production-evidence.ts","src/producer.ts","src/reference-bible.ts","src/render.ts","src/scaffold.ts","src/series-evolution.ts","src/sync.ts","src/types.ts","src/visual-screening.ts","src/youtube-state.ts","tests/audio.test.ts","tests/production-hardening.test.ts","tests/render.test.ts","tests/series-evolution.test.ts","tests/strict-production.test.ts","tests/sync.test.ts","docs/strict-series-production.md"]) {
            console.log('SF_FORMAT_FILE ' + path + ' ' + readFileSync(path).toString('base64'));
          }
          NODE
      - run: npm run build
